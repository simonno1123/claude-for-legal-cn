name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JSON sanity
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: China localization regression
        run: python3 scripts/localization-regression.py

      - name: Marketplace field-consistency regression
        run: python3 scripts/test-marketplace-consistency.py

      - name: Plugin reference reachability
        run: python3 scripts/check-plugin-references.py

      - name: Legal-data smoke test
        run: bash scripts/test-legal-data.sh

      - name: Managed-agent cookbook smoke test
        run: bash scripts/test-cookbooks.sh

      - name: C03 V8-A gate record tests
        run: python3 -m unittest discover -s validation/route_b_c03/v8 -t validation/route_b_c03/v8

      - name: C03 V8-B integrity tests (require ssh-keygen; must not be skipped)
        run: |
          set -o pipefail
          command -v ssh-keygen
          python3 -m unittest discover -s validation/route_b_c03/v8b -t validation/route_b_c03/v8b -v 2>&1 | tee v8b.log
          ! grep -q "skipped" v8b.log

      - name: Privacy guard tests
        run: python3 -m unittest discover -s validation/privacy_guard -t validation/privacy_guard

      - name: Privacy guard on lines added by this pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/privacy_guard/check_public_text.py --base "origin/${{ github.base_ref }}"
