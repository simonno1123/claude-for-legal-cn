# 检查项和红旗用于按我方角色、交易及政策核验和升级，不直接判定效力、违法或损失。
# standard是适用条件下的建议，不是现有合同权利或所有交易的统一法定要求。
checklist:
  - 主体资格和签约主体一致性
  - 授权代表、法定代表人、合同章、公章、电子签
  - 合同成立、生效条件、附件优先级
  - 交付、验收、质量保证、售后
  - 付款节点、发票类型、含税/不含税、税费承担
  - 发票税务“三流合一”与多流不一致专项复核（合同主体、开票主体、收款账户、真实交易链路）
  - 先票后款的实际约定、适用发票类型、开票与付款条件及其和交付验收的关系；纳税人身份和抵扣前提未知时补问
  - 发票异常及税务处理的事实、原因、损失与费用是否可分别追偿；不将异常凭证直接等同虚开或预设全额追偿
  - 廉洁合作协议与反商业贿赂条款
  - 格式条款提示说明义务
  - 违约责任、违约金、责任限制、例外
  - 知识产权归属、许可范围、成果交付
  - 个人信息、客户数据、商业秘密
  - 分包、转委托、转让、关联公司履约
  - 解除、终止、续约、退出
  - 适用法律、法院管辖/仲裁机构、送达
red_flags:
  - 无限责任或责任上限缺失
  - 境外法律或境外仲裁
  - 数据出境或 AI 训练授权
  - 知识产权一次性转让
  - 自动续约且无有效取消机制
  - 签约、开票、收付款主体不一致且交易链或相关安排待核实；作为税务和付款升级线索，不自动认定虚开或无法抵扣
  - 业务确需先票后款，但实际发票要求、错误开票处理或付款关系不清；先核我方角色、纳税人身份、抵扣条件及政策
  - 已披露发票异常、抵扣障碍或税务处理，而合同的更正、协作与责任分配不清；违法性质及各项追偿须分别核查
  - 违约金与定金罚则同时主张且未作选择排除
  - 签署身份或权限不明，或者部门章/项目章等用印与合同约定或权限材料不符；不只按章型认定无效或伪造
payment_and_tax_controls:
  invoice_before_payment_condition:
    standard: "先核实际付款约定、我方角色、纳税人身份及适用发票和抵扣条件。对符合买方业务需求与政策的交易，可建议明确合规发票、更正通知及相应付款处理；不得默认所有先票后款交易必须取得可抵扣专票，也不据建议确认买方当前已有无条件顺延或拒付权。销售侧另按收款及自身开票义务分析。"
    drafting_note: "发票不是验收证明；联查交付验收与开票付款关系，明确已约定内容和拟协商条件，不把建议顺序当法定或现有顺序。"
  tax_loss_compensation:
    standard: "对已核实的开票异常及税务处理，按原因、过错、损失和证据分别评估更正、协作及追偿，提出适用的责任分配建议。税款、滞纳金、罚款、调查成本及律师费的可追偿性分别核实，不预设供应商应全额承担或行政责任可以当然转嫁；合同未约定的救济也不回填为已有权利。"
    escalation: "出现异常凭证、税务稽查、三流不一致或代收代付安排时，必须升级税务和法务复核。"
